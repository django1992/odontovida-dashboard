const clp = (n) => "$" + Math.round(n).toLocaleString("es-CL");
const pct = (n, d) => (d ? ((n / d) * 100).toFixed(1) + "%" : "\u2014");
const money2 = (n) => (n === null || n === undefined ? "\u2014" : clp(n));
const num2 = (n) => (n === null || n === undefined ? "\u2014" : n.toLocaleString("es-CL"));
const rate2 = (n) => (n === null || n === undefined ? "\u2014" : n.toFixed(2).replace(".", ",") + "%");
const mult2 = (n) => (n === null || n === undefined ? "\u2014" : n.toFixed(2) + "\u00d7");
const fmtDate = (iso) => {
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
};
const MONTH_LABELS = { "01": "Ene", "02": "Feb", "03": "Mar", "04": "Abr", "05": "May", "06": "Jun", "07": "Jul", "08": "Ago", "09": "Sep", "10": "Oct", "11": "Nov", "12": "Dic" };

function timeAgo(iso) {
  if (!iso) return "";
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return "justo ahora";
  if (mins < 60) return `hace ${mins} min`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `hace ${hrs} h`;
  return `hace ${Math.round(hrs / 24)} d`;
}

// Suma EXACTA día por día dentro de [start, end] sobre el array `daily` dado, y recalcula
// todas las tasas/costos desde esos totales reales (nunca prorrateando ni promediando tasas).
function aggregateExact(daily, start, end) {
  const rows = daily.filter((r) => r.d >= start && r.d <= end);
  const sum = (k) => rows.reduce((a, r) => a + r[k], 0);
  const inversion = sum("inv");
  const impresiones = sum("imp");
  const clicks = sum("clk");
  const cmi = sum("cmi");
  const agendas = sum("ag");
  const citas = sum("ci");
  const asistencias = sum("asi");
  const cierres = sum("cie");
  const ventas = sum("ven");
  const recoleccion = sum("fac");
  return {
    inversion, clicks, cmi, agendas, citas, asistencias, cierres, ventas, recoleccion,
    cpm: impresiones ? (inversion / impresiones) * 1000 : null,
    ctr: impresiones ? (clicks / impresiones) * 100 : null,
    cmiLP: clicks ? (cmi / clicks) * 100 : null,
    cpcmi: cmi ? inversion / cmi : null,
    scr: cmi ? (agendas / cmi) * 100 : null,
    asisPct: citas ? (asistencias / citas) * 100 : null,
    asisCost: asistencias ? inversion / asistencias : null,
    ccPct: asistencias ? (cierres / asistencias) * 100 : null,
    cac: cierres ? inversion / cierres : null,
    cpa: cierres ? inversion / cierres : null,
    roas: inversion ? recoleccion / inversion : null,
    croi: inversion ? (recoleccion - inversion) / inversion : null,
  };
}

function Dashboard() {
  const [daily, setDaily] = useState(FALLBACK_DAILY);
  const [status, setStatus] = useState("cached-initial"); // loading | live | cached-error | cached-initial
  const [lastSync, setLastSync] = useState(null);
  const [errorMsg, setErrorMsg] = useState(null);
  const [rangeTouched, setRangeTouched] = useState(false);

  const dailyBounds = useMemo(
    () => ({ first: daily[0].d, last: daily[daily.length - 1].d }),
    [daily]
  );
  const [range, setRange] = useState({ start: dailyBounds.first, end: dailyBounds.last });

  useEffect(() => {
    if (!rangeTouched) setRange({ start: dailyBounds.first, end: dailyBounds.last });
  }, [dailyBounds, rangeTouched]);

  const fetchLive = () => {
    setStatus("loading");
    fetch("/api/sheet?t=" + Date.now())
      .then((r) => r.json())
      .then((json) => {
        if (json.ok && json.daily && json.daily.length) {
          setDaily(json.daily);
          setStatus("live");
          setLastSync(json.syncedAt);
          setErrorMsg(null);
        } else {
          setStatus("cached-error");
          setErrorMsg(json.error || "Respuesta inválida del servidor");
        }
      })
      .catch((err) => {
        setStatus("cached-error");
        setErrorMsg(String(err));
      });
  };

  useEffect(() => {
    fetchLive();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const { FIRST_DATE, LAST_DATE, MONTHLY, TOTAL } = useMemo(() => {
    const FIRST_DATE = daily[0].d;
    const LAST_DATE = daily[daily.length - 1].d;
    const monthKeys = Array.from(new Set(daily.map((r) => r.d.slice(0, 7)))).sort();
    const todayKey = new Date().toISOString().slice(0, 7);
    const MONTHLY = monthKeys.map((key) => {
      const rows = daily.filter((r) => r.d.startsWith(key));
      const start = rows[0].d;
      const end = rows[rows.length - 1].d;
      const label = MONTH_LABELS[key.slice(5, 7)] + (key === todayKey ? "*" : "");
      return { key, month: label, start, end, ...aggregateExact(daily, start, end) };
    });
    const TOTAL = aggregateExact(daily, FIRST_DATE, LAST_DATE);
    return { FIRST_DATE, LAST_DATE, MONTHLY, TOTAL };
  }, [daily]);

  const data = useMemo(() => {
    const agg = aggregateExact(daily, range.start, range.end);
    let label;
    if (range.start === FIRST_DATE && range.end === LAST_DATE) label = "Acumulado";
    else label = `${fmtDate(range.start)} \u2013 ${fmtDate(range.end)}`;
    return { month: label, ...agg };
  }, [daily, range, FIRST_DATE, LAST_DATE]);

  const handleStartChange = (e) => {
    const start = e.target.value;
    setRangeTouched(true);
    setRange((r) => ({ start, end: start > r.end ? start : r.end }));
  };
  const handleEndChange = (e) => {
    const end = e.target.value;
    setRangeTouched(true);
    setRange((r) => ({ end, start: end < r.start ? end : r.start }));
  };

  const isFullRange = range.start === FIRST_DATE && range.end === LAST_DATE;

  const funnelValues = {
    agendas: data.agendas,
    citas: data.citas,
    asistencias: data.asistencias,
    cierres: data.cierres,
  };
  const funnelMax = data.agendas || 1;

  return (
    <div style={styles.page}>

        * { box-sizing: border-box; }
        .odv-card { transition: transform .18s ease, box-shadow .18s ease; }
        .odv-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(11,31,29,0.10); }
        .odv-pill { transition: background .15s ease, color .15s ease; }
        .odv-fade { animation: odvFade .5s ease both; }
        @keyframes odvFade { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform:none; } }
        .odv-date { transition: border-color .15s ease; }
        .odv-date:focus { outline: none; border-color: #0E7C7B; }
        .odv-refresh { transition: opacity .15s ease; cursor: pointer; }
        .odv-refresh:hover { opacity: 0.7; }
        @keyframes odvSpin { to { transform: rotate(360deg); } }
        .odv-spin { display: inline-block; animation: odvSpin 1s linear infinite; }
      `}</style>

      <header style={styles.header} className="odv-fade">
        <div>
          <div style={styles.eyebrow}>PANEL DE RESULTADOS · META ADS × VENTAS</div>
          <h1 style={styles.h1}>Clínica Odontovida</h1>
          <div style={styles.subtitle}>Funnel completo: inversión publicitaria → agenda → cierre → facturación</div>
        </div>

        <div style={styles.controlsCol}>
          <div style={styles.statusRow}>
            {status === "loading" && (
              <span style={styles.statusBadge}><span className="odv-spin">↻</span> Conectando con Sheets…</span>
            )}
            {status === "live" && (
              <span style={{ ...styles.statusBadge, color: "#0E7C7B" }}>● En vivo · sync {timeAgo(lastSync)}</span>
            )}
            {status === "cached-error" && (
              <span style={{ ...styles.statusBadge, color: "#B54A3F" }} title={errorMsg || ""}>
                ● Datos guardados (sin conexión en vivo)
              </span>
            )}
            {status === "cached-initial" && (
              <span style={{ ...styles.statusBadge, color: "#8AA19E" }}>● Datos guardados</span>
            )}
            <span className="odv-refresh" style={styles.refreshBtn} onClick={fetchLive} title="Actualizar ahora">
              ↻ Actualizar
            </span>
          </div>
          <div style={styles.dateRow}>
            <span style={styles.dateLabel}>Desde</span>
            <input
              type="date"
              className="odv-date"
              style={styles.dateInput}
              min={FIRST_DATE}
              max={LAST_DATE}
              value={range.start}
              onChange={handleStartChange}
              aria-label="Fecha de inicio"

            {FUNNEL_STAGES.map((s, i) => {
              const val = funnelValues[s.key];
              const width = Math.max(8, (val / funnelMax) * 100);
              const prevVal = i === 0 ? val : funnelValues[FUNNEL_STAGES[i - 1].key];
              const dropPct = prevVal ? (100 - (val / prevVal) * 100).toFixed(0) : 0;
              return (
                <div key={s.key} style={styles.funnelRow}>
                  <div style={styles.funnelLabelCol}>
                    <div style={styles.funnelLabel}>{s.label}</div>
                    {i > 0 && <div style={styles.funnelDrop}>− {dropPct}%</div>}
                  </div>
                  <div style={styles.funnelTrack}>
                    <div style={{ ...styles.funnelBar, width: width + "%" }}>
                      <span style={styles.funnelValue}>{val}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          <div style={styles.footnote}>* Cifras exactas por día (no prorrateadas).</div>
        </div>

        <div style={styles.panel} className="odv-fade">
          <div style={styles.panelTitle}>Inversión vs. Ventas por mes</div>
          <ResponsiveContainer width="100%" height={280}>
            <AreaChart data={MONTHLY} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
              <defs>
                <linearGradient id="ventasGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#0E7C7B" stopOpacity={0.35} />
                  <stop offset="100%" stopColor="#0E7C7B" stopOpacity={0} />
                </linearGradient>
              </defs>
              <CartesianGrid strokeDasharray="2 4" stroke="#E1E8E6" vertical={false} />
              <XAxis dataKey="month" tick={{ fontFamily: "Inter", fontSize: 12, fill: "#5B6E6B" }} axisLine={{ stroke: "#DCE4E2" }} tickLine={false} />
              <YAxis
                tickFormatter={(v) => (v / 1000000).toFixed(1) + "M"}
                tick={{ fontFamily: "IBM Plex Mono", fontSize: 11, fill: "#5B6E6B" }}
                axisLine={false}
                tickLine={false}
                width={48}
              />
              <Tooltip
                formatter={(v, name) => [clp(v), name]}
                contentStyle={{ fontFamily: "Inter", fontSize: 13, borderRadius: 10, border: "1px solid #DCE4E2" }}
              />
              <Legend wrapperStyle={{ fontFamily: "Inter", fontSize: 12 }} />
              <Area type="monotone" dataKey="ventas" name="Ventas" stroke="#0E7C7B" fill="url(#ventasGrad)" strokeWidth={2.5} />
              <Line type="monotone" dataKey="inversion" name="Inversión Meta" stroke="#B54A3F" strokeWidth={2.5} dot={{ r: 3 }} />
            </AreaChart>
          </ResponsiveContainer>
        </div>
      </section>

      <section style={styles.panel} className="odv-fade">
        <div style={styles.panelTitle}>Detalle mensual completo</div>
        <div style={styles.tableWrap}>
          <table style={styles.table}>
            <thead>
              <tr>
                {[
                  "Mes", "Inversión", "CPM", "Clicks", "CTR", "CMI", "LP%", "CPCMI",
                  "Agendas", "SCR-%", "Citas", "Asistencias", "Asis %", "ASIS-$",
                  "Unidades", "CC%", "Ventas", "Facturado", "CPA", "C-ROI",
                ].map((h) => (
                  <th key={h} style={styles.th}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {MONTHLY.map((m) => (
                <tr key={m.month} style={m.start <= range.end && m.end >= range.start ? styles.trActive : undefined}>
                  <td style={styles.tdLabel}>{m.month}</td>
                  <td style={styles.td}>{money2(m.inversion)}</td>
                  <td style={styles.td}>{money2(m.cpm)}</td>
                  <td style={styles.td}>{num2(m.clicks)}</td>

                  <td style={styles.td}>{rate2(m.cmiLP)}</td>
                  <td style={styles.td}>{money2(m.cpcmi)}</td>
                  <td style={styles.td}>{num2(m.agendas)}</td>
                  <td style={styles.td}>{rate2(m.scr)}</td>
                  <td style={styles.td}>{num2(m.citas)}</td>

                  <td style={styles.td}>{money2(m.cpa)}</td>
                  <td style={styles.td}>{mult2(m.croi)}</td>
                </tr>
              ))}
              <tr style={styles.trTotal}>
                <td style={styles.tdLabel}>Total</td>
                <td style={styles.td}>{money2(TOTAL.inversion)}</td>
                <td style={styles.td}>{money2(TOTAL.cpm)}</td>
                <td style={styles.td}>{num2(TOTAL.clicks)}</td>
                <td style={styles.td}>{rate2(TOTAL.ctr)}</td>
                <td style={styles.td}>{num2(TOTAL.cmi)}</td>
                <td style={styles.td}>{rate2(TOTAL.cmiLP)}</td>
                <td style={styles.td}>{money2(TOTAL.cpcmi)}</td>
                <td style={styles.td}>{num2(TOTAL.agendas)}</td>
                <td style={styles.td}>{rate2(TOTAL.scr)}</td>
                <td style={styles.td}>{num2(TOTAL.citas)}</td>
                <td style={styles.td}>{num2(TOTAL.asistencias)}</td>
                <td style={styles.td}>{rate2(TOTAL.asisPct)}</td>
                <td style={styles.td}>{money2(TOTAL.asisCost)}</td>
                <td style={styles.td}>{num2(TOTAL.cierres)}</td>

                <td style={styles.td}>{money2(TOTAL.recoleccion)}</td>
                <td style={styles.td}>{money2(TOTAL.cpa)}</td>
                <td style={styles.td}>{mult2(TOTAL.croi)}</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div style={styles.footnote}>
          * Enero fue 100% orgánico (WhatsApp), por eso CPM/CTR/LP%/C-ROI no aplican ese mes.
        </div>
      </section>

      <footer style={styles.footer}>
        {status === "live"
          ? "Conectado en vivo a tu Google Sheets (cuenta de servicio de Google). Se refresca al abrir la página y con el botón \u201cActualizar\u201d."
          : "Mostrando datos guardados porque no se pudo conectar en vivo con el Sheets. Usa \u201cActualizar\u201d para reintentar."}
      </footer>
    </div>
  );
}

function KpiCard({ label, value, sub, accent }) {
  const accentColor = { teal: "#0E7C7B", mint: "#3FA796", coral: "#B54A3F", muted: "#8AA19E" }[accent] || "#0E7C7B";
  return (
    <div className="odv-card" style={styles.kpiCard}>
      <div style={{ ...styles.kpiBar, background: accentColor }} />
      <div style={styles.kpiLabel}>{label}</div>
      <div style={styles.kpiValue}>{value}</div>
      {sub && <div style={{ ...styles.kpiSub, color: accentColor }}>{sub}</div>}
    </div>
  );
}
